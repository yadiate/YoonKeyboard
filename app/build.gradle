plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new java.util.Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropertiesFile.exists()
            && (graph.hasTask(":app:assembleRelease") || graph.hasTask(":app:bundleRelease"))) {
        throw new GradleException("Missing keystore.properties for release signing.")
    }
}

android {
    namespace "com.yadiate.yoonkeyboard"
    compileSdk 35

    defaultConfig {
        applicationId (project.findProperty("keyboardApplicationId") ?: "com.yadiate.yoonkeyboard")
        minSdk 21
        targetSdk 35
        versionCode ((project.findProperty("keyboardVersionCode") ?: "36") as Integer)
        versionName (project.findProperty("keyboardVersionName") ?: "0.2.34")
        manifestPlaceholders = [
                keyboardAppLabel: project.findProperty("keyboardAppLabel") ?: "@string/app_name"
        ]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                if (keystoreProperties["storeType"]) {
                    storeType keystoreProperties["storeType"]
                }
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            } else {
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
